name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # 署名の鍵（Mac の debug 鍵）がまだリポジトリにないときは、ビルドしない（ほかの鍵で作ったものを出さないため）
      - name: Check signing key
        run: |
          if [ ! -f app/debug.keystore ]; then
            echo "::warning::app/debug.keystore がまだありません。Mac から入れるまでビルドしません"
            echo "NOKEY=1" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        if: env.NOKEY != '1'
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease -PbuildNumber=${{ github.run_number }}
      # main への書き込みだけ Releases に出す（アプリの「更新」はここから取る）
      - name: Publish release
        if: github.ref == 'refs/heads/main' && env.NOKEY != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(./gradlew -q --no-daemon printVersionName -PbuildNumber=${{ github.run_number }} | tail -1)
          TAG="v${NAME}"
          APK="${{ github.event.repository.name }}-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          git log -1 --pretty=%B > notes.txt
          gh release create "$TAG" "$APK" --title "$TAG" --notes-file notes.txt --target "${{ github.sha }}"
          # 移行のため：前の版（v1.26 まで）のアプリは apk ブランチの APK を見て更新するので、最新の1つだけ置いておく
          mkdir apkbranch && cp "$APK" "apkbranch/calendar-widget-${TAG}.apk"
          cd apkbranch
          git init -q -b apk
          git config user.name tapeinooo
          git config user.email tapeinooo@users.noreply.github.com
          git add . && git commit -qm "APK ${TAG}（v1.26 までの版の更新の受け口）"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" apk
